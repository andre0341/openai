<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Parser Offerte Viaggi</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.datatables.net/1.11.3/js/jquery.dataTables.min.js"></script>
  <link rel="stylesheet" href="https://cdn.datatables.net/1.11.3/css/jquery.dataTables.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="title">
      <span class="logo">✈️</span>
      <div>
        <h1>Caesar Tour Deals</h1>
        <p>Last Second Offers Tracker</p>
      </div>
    </div>
    <div class="actions">
      <span id="lastUpdated">Last updated: -</span>
      <button id="refreshBtn">Refresh Data</button>
    </div>
  </header>

  <main>
    <aside id="sidebar">
      <h2>Search &amp; Filters</h2>
      <input type="text" id="searchInput" placeholder="Search offers">
      <div id="filterContainer">
        <button id="filterToggle">Filter Regions</button>
        <div id="filterDropdown"></div>
      </div>
    </aside>

    <section id="content">
      <textarea id="inputText" placeholder="Inserisci testo HTML..."></textarea><br>
      <button id="parseBtn">Parse Data</button>
      <button id="uploadBtn">Upload to DB</button>
      <table id="results" class="display"></table>
    </section>
  </main>

  <script src="js/get_data.js"></script>
</body>
</html>
